<!doctype html>
<html lang="id">
  <head>
    <link rel="icon" type="image/png" href="favicon.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generator Catatan Pencairan</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="container">
      <!-- Konversi Nominal -->
      <section class="card">
        <h1>Konversi Angka</h1>
        <p class="subtitle">Klik hasil untuk copy.</p>

        <div class="field">
          <label for="nominalInput">Input</label>

          <textarea
            id="nominalInput"
            rows="3"
            placeholder="Contoh: Rp 10.577.000,-"
          ></textarea>
        </div>

        <div class="field">
          <label for="nominalOutput">Hasil</label>

          <div class="copy-wrapper">
            <textarea id="nominalOutput" rows="2" readonly></textarea>
            <span class="copy-badge">Copied</span>
          </div>
        </div>
      </section>

      <!-- Generator Catatan -->
      <section class="card">
        <h1>Maker Generator</h1>
        <p class="subtitle">Klik output untuk copy.</p>

        <div class="field">
          <label for="jenis">Jenis</label>

          <select id="jenis">
            <option value="Belanja Bahan Baku">Belanja Bahan Baku</option>
            <option value="Biaya Ops Harian">Biaya Ops Harian</option>
            <option value="Belanja Gas">Belanja Gas</option>
          </select>
        </div>

        <div class="field">
          <label for="tanggal">Tanggal</label>

          <input type="date" id="tanggal" />
        </div>

        <div class="field">
          <label for="output">Output</label>

          <div class="copy-wrapper">
            <textarea id="output" readonly rows="3"></textarea>
            <span class="copy-badge">Copied</span>
          </div>
        </div>
      </section>

      <!-- Generator Pencairan -->
      <section class="card card--pencairan">
        <h1>Request Generator</h1>
        <p class="subtitle">Tambah beberapa request sekaligus.</p>

        <div class="field">
          <label for="pencDapur">Nama Dapur</label>
          <select id="pencDapur"></select>
        </div>

        <div class="field">
          <label for="pencTanggal">Tanggal</label>
          <input type="date" id="pencTanggal" />
        </div>

        <div id="pencRows" class="penc-rows"></div>

        <button class="btn-add" id="pencAddRow">+ Tambah Baris</button>

        <div class="field" style="margin-top: 18px">
          <label>Output</label>
          <div class="copy-wrapper">
            <textarea id="pencOutput" readonly rows="6"></textarea>
            <span class="copy-badge">Copied</span>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
