<!DOCTYPE html>
<html lang="id">
  <head>
    <link rel="icon" type="image/png" href="favicon.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generator Catatan Pencairan</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="container">
      <section class="card">
        <h1>Generator Catatan Pencairan</h1>
        <p class="subtitle">
  Klik output untuk langsung copy.
</p>

        <div class="field">
          <label for="jenis">Jenis</label>

          <select id="jenis">
            <option value="Biaya Bahan Baku">Biaya Bahan Baku</option>
            <option value="Biaya Operasional">Biaya Operasional</option>
            <option value="Biaya Gas">Biaya Gas</option>
          </select>
        </div>

        <div class="field">
          <label for="tanggal">Tanggal</label>

          <input type="date" id="tanggal" />
        </div>

        <div class="field">
          <label for="output">Output</label>

          <textarea
            id="output"
            readonly
            rows="3"
          ></textarea>
        </div>
      </section>

      <section class="card">
  <h1>Konversi Nominal</h1>
<p class="subtitle">
  Tempel nominal lalu klik hasil untuk copy.
</p>
  <div class="field">
    <label for="nominalInput">Input</label>

    <textarea
      id="nominalInput"
      rows="3"
      placeholder="Contoh: Rp 10.577.000,-"
    ></textarea>
  </div>

  <div class="field">
    <label for="nominalOutput">Hasil</label>

    <textarea
      id="nominalOutput"
      rows="3"
      readonly
    ></textarea>
  </div>
</section>

    </main>

    <script src="script.js"></script>
  </body>
</html>
