<!doctype html>
<html lang="id">
  <head>
    <link rel="icon" type="image/png" href="favicon.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generator Catatan Pencairan</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="container">
      <!-- Maker Generator -->
      <section class="card card-wide">
        <h1>Maker Generator</h1>
        <p class="subtitle">Klik hasil/output untuk copy.</p>

        <div class="split">
          <div class="col col-input">
            <div class="field date-format-field">
              <label class="toggle-label" for="tanggalSpasi">
                <span>Format Tanggal Spasi</span>
                <input type="checkbox" id="tanggalSpasi" />
                <span class="toggle-switch" aria-hidden="true"></span>
              </label>
            </div>

            <div class="field">
              <label for="tanggal">Tanggal</label>

              <input type="date" id="tanggal" />
            </div>

            <div class="field">
              <label>Bahan Baku</label>

              <div class="bahan-grid" id="bahanGrid"></div>
            </div>

            <div class="field">
              <label for="nominalInput">Input Nominal</label>

              <textarea
                id="nominalInput"
                rows="1"
                placeholder="Contoh: Rp 10.577.000,-"
              ></textarea>
            </div>

            <div class="field">
              <label for="nominalOutput">Output Nominal</label>

              <div class="copy-wrapper">
                <textarea id="nominalOutput" rows="1" readonly></textarea>
                <span class="copy-badge">Copied</span>
              </div>
            </div>

            <div class="field">
              <label for="outputInsentifPicPosyandu">Insentif PIC Posyandu</label>

              <div class="copy-wrapper">
                <textarea id="outputInsentifPicPosyandu" readonly rows="1"></textarea>
                <span class="copy-badge">Copied</span>
              </div>
            </div>

            <div class="field">
              <label for="outputTanggal">Tanggal</label>

              <div class="copy-wrapper">
                <textarea id="outputTanggal" readonly rows="1"></textarea>
                <span class="copy-badge">Copied</span>
              </div>
            </div>
          </div>

          <div class="col col-output">
            <div class="field">
              <label for="outputBelanja">Output Belanja</label>

              <div class="copy-wrapper">
                <textarea id="outputBelanja" readonly rows="1"></textarea>
                <span class="copy-badge">Copied</span>
              </div>
            </div>

            <div class="field">
              <label for="outputOperasional">Output Operasional</label>

              <div class="copy-wrapper">
                <textarea id="outputOperasional" readonly rows="1"></textarea>
                <span class="copy-badge">Copied</span>
              </div>
            </div>

            <div class="field">
              <label for="outputGas">Output Gas</label>

              <div class="copy-wrapper">
                <textarea id="outputGas" readonly rows="1"></textarea>
                <span class="copy-badge">Copied</span>
              </div>
            </div>

            <div class="field">
              <label for="outputInsentifFasilitas">Insentif Fasilitas SPPG</label>

              <div class="copy-wrapper">
                <textarea id="outputInsentifFasilitas" readonly rows="1"></textarea>
                <span class="copy-badge">Copied</span>
              </div>
            </div>

            <div class="field">
              <label for="outputSewaKendaraan">Sewa Kendaraan</label>

              <div class="copy-wrapper">
                <textarea id="outputSewaKendaraan" readonly rows="1"></textarea>
                <span class="copy-badge">Copied</span>
              </div>
            </div>

            <div class="field">
              <label for="outputGajiRelawan">Gaji Relawan</label>

              <div class="copy-wrapper">
                <textarea id="outputGajiRelawan" readonly rows="1"></textarea>
                <span class="copy-badge">Copied</span>
              </div>
            </div>

            <div class="field">
              <label for="outputInsentifPicSekolah">Insentif PIC Sekolah</label>

              <div class="copy-wrapper">
                <textarea id="outputInsentifPicSekolah" readonly rows="1"></textarea>
                <span class="copy-badge">Copied</span>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
